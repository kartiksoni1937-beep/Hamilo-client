plugins {
    id 'fabric-loom' version '1.7.4'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
}

// Pojav's PreMain-Class injector is modeled on its Java 8-compatible injector
// entrypoint. Keep the bootstrap bytecode Java 8-compatible while the GUI,
// which links against Minecraft 1.21 classes, stays on Java 21.
sourceSets {
    main {
        java {
            exclude 'dev/hamilo/client/HamiloAgent.java'
        }
    }
    agent {
        java {
            srcDir 'src/main/java'
            include 'dev/hamilo/client/HamiloAgent.java'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.named('compileAgentJava', JavaCompile).configure {
    options.release = 8
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    // Package the Java 8 bootstrap beside the Java 21 Minecraft GUI classes.
    from(sourceSets.agent.output)

    manifest {
        attributes(
            // Pojav-style loader injection reads this custom manifest key.
            'PreMain-Class': 'dev.hamilo.client.HamiloAgent',
            // Keep standard Java-agent keys for compatible launchers too.
            'Premain-Class': 'dev.hamilo.client.HamiloAgent',
            'Agent-Class': 'dev.hamilo.client.HamiloAgent',
            'Can-Redefine-Classes': 'false',
            'Can-Retransform-Classes': 'false'
        )
    }
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
