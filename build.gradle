plugins {
    id 'fabric-loom' version '1.7.4'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    manifest {
        attributes(
            // Pojav-style loader injection reads this custom manifest key.
            'PreMain-Class': 'dev.hamilo.client.HamiloAgent',
            // Keep standard Java-agent keys for compatible launchers too.
            'Premain-Class': 'dev.hamilo.client.HamiloAgent',
            'Agent-Class': 'dev.hamilo.client.HamiloAgent',
            'Can-Redefine-Classes': 'false',
            'Can-Retransform-Classes': 'false'
        )
    }
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
