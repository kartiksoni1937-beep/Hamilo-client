name: Build Hamilo Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build injectable JAR
        run: gradle build
      - name: Verify injection manifest
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'hamilo-client-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | head -n 1)"
          if [[ -z "$JAR" ]]; then
            echo "No main Hamilo client JAR found in build/libs. Contents:"
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi
          echo "Checking $JAR"
          echo "HAMILO_JAR_PATH=$JAR" >> "$GITHUB_ENV"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | tee /tmp/hamilo-manifest.txt
          grep -Eiq '^PreMain-Class: dev\.hamilo\.client\.HamiloAgent$' /tmp/hamilo-manifest.txt
          grep -Eiq '^Premain-Class: dev\.hamilo\.client\.HamiloAgent$' /tmp/hamilo-manifest.txt
          grep -Eiq '^Agent-Class: dev\.hamilo\.client\.HamiloAgent
      - name: Upload injectable JAR
        uses: actions/upload-artifact@v4
        with:
          name: hamilo-client-injectable-jar
          path: ${{ env.HAMILO_JAR_PATH }}
          if-no-files-found: error
 /tmp/hamilo-manifest.txt
          grep -Eiq '^Main-Class: dev\\.hamilo\\.client\\.HamiloAgent
      - name: Upload injectable JAR
        uses: actions/upload-artifact@v4
        with:
          name: hamilo-client-injectable-jar
          path: ${{ env.HAMILO_JAR_PATH }}
          if-no-files-found: error
 /tmp/hamilo-manifest.txt
          # Verify the bootstrap can load on Java 8-era launcher runtimes (class major 52).
          javap -verbose -classpath "$JAR" dev.hamilo.client.HamiloAgent | grep -q 'major version: 52'
      - name: Upload injectable JAR
        uses: actions/upload-artifact@v4
        with:
          name: hamilo-client-injectable-jar
          path: ${{ env.HAMILO_JAR_PATH }}
          if-no-files-found: error
