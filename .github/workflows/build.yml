name: Build Hamilo Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build agent JAR
        run: gradle build
      - name: Verify agent manifest
        run: |
          test -f build/libs/hamilo-client-1.0.0.jar
          unzip -p build/libs/hamilo-client-1.0.0.jar META-INF/MANIFEST.MF | grep -q 'Premain-Class: dev.hamilo.client.HamiloAgent'
          unzip -p build/libs/hamilo-client-1.0.0.jar META-INF/MANIFEST.MF | grep -q 'Agent-Class: dev.hamilo.client.HamiloAgent'
      - name: Upload agent JAR
        uses: actions/upload-artifact@v4
        with:
          name: hamilo-client-jar
          path: build/libs/hamilo-client-1.0.0.jar
          if-no-files-found: error
